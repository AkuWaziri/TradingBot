name: Solana Advanced Intelligence Test

on:
  workflow_dispatch:
    inputs:
      mint:
        description: "Solana token mint / contract address"
        required: true
        type: string
      signature_limit:
        description: "Recent signatures to inspect"
        required: false
        default: "50"
        type: string

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Inspect advanced intelligence
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          HELIUS_RPC_BASE_URL: https://mainnet.helius-rpc.com
          TARGET_MINT: ${{ inputs.mint }}
          SIGNATURE_LIMIT: ${{ inputs.signature_limit }}
        run: |
          python - <<'PY'
          import os
          from advanced_intelligence import inspect_advanced_intelligence
          from helius_onchain import HeliusProvider

          class CachedHeliusProvider:
              """Read-only request cache for one intelligence inspection.

              The advanced layers intentionally remain unchanged. This adapter
              prevents repeated signature/transaction RPC calls for the same
              token from consuming the Helius quota multiple times.
              """

              def __init__(self, inner, primary_mint, signature_limit):
                  self.inner = inner
                  self.primary_mint = primary_mint
                  self.signature_limit = signature_limit
                  self._signatures = {}
                  self._transactions = {}

              def get_recent_signatures(self, address, limit=100):
                  address = str(address).strip()
                  requested = max(1, int(limit))
                  cached = self._signatures.get(address)
                  if cached is not None:
                      return cached[:requested]

                  # The creator layer asks for up to 1000 signatures, but the
                  # inspection run has an explicit bounded signature budget.
                  # Reuse the same bounded mint window rather than silently
                  # launching another large RPC scan.
                  fetch_limit = self.signature_limit if address == self.primary_mint else min(requested, 20)
                  result = self.inner.get_recent_signatures(address, limit=fetch_limit)
                  self._signatures[address] = list(result)
                  return self._signatures[address][:requested]

              def get_transaction(self, signature):
                  signature = str(signature).strip()
                  if signature in self._transactions:
                      return self._transactions[signature]
                  result = self.inner.get_transaction(signature)
                  self._transactions[signature] = result
                  return result

          mint = os.environ["TARGET_MINT"].strip()
          limit = int(os.environ["SIGNATURE_LIMIT"])
          if not 1 <= limit <= 100:
              raise ValueError("SIGNATURE_LIMIT must be between 1 and 100")

          provider = CachedHeliusProvider(HeliusProvider(), mint, limit)
          result = inspect_advanced_intelligence(
              mint,
              provider=provider,
              signature_limit=limit,
              max_transactions=min(limit, 50),
          )

          print("SOLANA ADVANCED INTELLIGENCE")
          print("mode=read-only; execution=disabled")
          print(f"mint={result.mint}")
          print("")
          print("BUNDLE / RELATED WALLETS")
          print(f"wallets_scanned={result.bundle.wallets_scanned}")
          print(f"wallets_in_possible_related_groups={result.bundle.wallets_in_related_groups}")
          print(f"largest_group_share={result.bundle.largest_group_share}")
          for group in result.bundle.possible_related_groups:
              print(f"possible_funder={group.funder} wallets={','.join(group.wallets)}")

          print("")
          print("CREATOR / DEPLOYER")
          print(f"creator={result.creator.creator_wallet}")
          print(f"creation_signature={result.creator.creation_signature}")
          print(f"creation_slot={result.creator.creation_slot}")
          print(f"creator_buys_observed={result.creator.creator_buys_observed}")
          print(f"creator_sells_observed={result.creator.creator_sells_observed}")
          print(f"creator_incomplete_transactions={result.creator.incomplete_transactions}")

          print("")
          print("FLOW / PARTICIPATION")
          print(f"signatures_scanned={result.flow.signatures_scanned}")
          print(f"transactions_parsed={result.flow.transactions_parsed}")
          print(f"observed_buys={result.flow.observed_buys}")
          print(f"observed_sells={result.flow.observed_sells}")
          print(f"unique_buyers={result.flow.unique_buyers}")
          print(f"unique_sellers={result.flow.unique_sellers}")
          print(f"unique_participants={result.flow.unique_participants}")
          print(f"buyer_participation_growth_ratio={result.flow.buyer_participation_growth_ratio}")
          print(f"buy_flow_growth_ratio={result.flow.buy_flow_growth_ratio}")
          print(f"incomplete_transactions={result.flow.incomplete_transactions}")

          print("")
          print("MANIPULATION / WASH-TRADE WARNINGS")
          print(f"observed_trades={result.manipulation.observed_trades}")
          print(f"unique_traders={result.manipulation.unique_traders}")
          print(f"largest_trader_trade_share={result.manipulation.largest_trader_trade_share}")
          print(f"largest_trader_flow_share={result.manipulation.largest_trader_flow_share}")
          print(f"repeated_trader_share={result.manipulation.repeated_trader_share}")
          print(f"buy_sell_count_ratio={result.manipulation.buy_sell_count_ratio}")
          print(f"warnings={','.join(result.manipulation.warnings) or 'none'}")
          print("")
          print("IMPORTANT: possible related wallets and manipulation warnings are heuristic research signals, not proof of coordinated behavior.")
          PY
