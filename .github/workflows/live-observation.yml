name: Live Observation

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of Solana candidates to inspect"
        required: false
        default: "10"
        type: string

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Helius RPC methods
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          HELIUS_RPC_BASE_URL: https://mainnet.helius-rpc.com
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          key = os.getenv("HELIUS_API_KEY", "")
          base = os.getenv("HELIUS_RPC_BASE_URL", "https://mainnet.helius-rpc.com").rstrip("/")
          if not key:
              raise SystemExit("HELIUS_API_KEY is missing inside the GitHub Actions job")

          mint = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"

          def call(method, params):
              payload = json.dumps({
                  "jsonrpc": "2.0",
                  "id": f"helius-diagnostic-{method}",
                  "method": method,
                  "params": params,
              }).encode("utf-8")
              request = Request(
                  f"{base}/?api-key={key}",
                  data=payload,
                  method="POST",
                  headers={"Accept": "application/json", "Content-Type": "application/json"},
              )
              try:
                  with urlopen(request, timeout=15) as response:
                      body = response.read().decode("utf-8", errors="replace")
                      print(f"HELIUS_{method}_HTTP_STATUS={response.status}")
                      print(f"HELIUS_{method}_RESPONSE={body[:800]}")
                      return response.status
              except HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")[:800]
                  print(f"HELIUS_{method}_HTTP_STATUS={exc.code}")
                  print(f"HELIUS_{method}_RESPONSE={body}")
                  return exc.code
              except URLError as exc:
                  print(f"HELIUS_{method}_NETWORK_ERROR={exc.reason}")
                  return 0

          results = {
              "getHealth": call("getHealth", []),
              "getAsset": call("getAsset", [{"id": mint, "options": {"showFungible": True}}]),
              "getTokenSupply": call("getTokenSupply", [mint, {"commitment": "confirmed"}]),
              "getTokenLargestAccounts": call("getTokenLargestAccounts", [mint, {"commitment": "confirmed"}]),
          }

          print(f"HELIUS_DIAGNOSTIC_SUMMARY={results}")
          PY

      - name: Run read-only Solana observation
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          HELIUS_RPC_BASE_URL: https://mainnet.helius-rpc.com
        run: python live_runner.py --limit "${{ inputs.limit }}"
