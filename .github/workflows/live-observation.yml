name: Live Observation

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of Solana candidates to inspect"
        required: false
        default: "10"
        type: string

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run read-only Solana observation
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          HELIUS_RPC_URL: https://mainnet.helius-rpc.com
        run: python live_runner.py --limit "${{ inputs.limit }}"
