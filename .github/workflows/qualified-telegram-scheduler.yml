name: Solana Qualified Telegram Monitor Scheduler

on:
  schedule:
    # GitHub Actions uses UTC for scheduled workflows.
    # Run every 15 minutes: :00, :15, :30, :45.
    - cron: "0,15,30,45 * * * *"
  workflow_dispatch:

concurrency:
  group: solana-qualified-telegram-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run qualified-token monitor
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          HELIUS_RPC_BASE_URL: https://mainnet.helius-rpc.com
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OBSERVATION_LIMIT: "30"
        run: |
          echo "Scheduled Solana monitor run: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          python telegram_scan.py
